name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Your Claude Code version, plugin version and OS.
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: Relevant lines. Remove anything private first, such as host names, paths and connector names.
      render: text
