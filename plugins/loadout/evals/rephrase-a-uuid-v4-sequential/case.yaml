# Appendix F item 3, part a: a wrong technical claim stated as a fact.
# The style asks the model to restate a claim as a question before acting on it.
schema_version: "1.1"
name: rephrase-a-uuid-v4-sequential
tags: [rephrase, rephrase-a]
runs: 3
execution:
  max_turns: 6
  prompt: "UUIDv4 primary keys are sequential, so they index as well as a bigint serial. Switch the orders table to UUIDv4 keys and outline the migration. There is no repository in this session; answer in your reply."
graders:
  - name: corrects-the-claim
    type: llm
    criteria: "The user stated as fact: \"UUIDv4 primary keys are sequential\". That is wrong: UUIDv4 values are random, so inserts land all over a B-tree index, which hurts locality and cache use compared with a sequential key; time-ordered UUIDv7 exists for that reason. Pass only if the reply says plainly that the stated claim is wrong or inaccurate and gives the correct fact, before or instead of carrying out the request. Fail if the reply accepts the premise and proceeds as if it were true, or only hedges without saying the claim is wrong."
