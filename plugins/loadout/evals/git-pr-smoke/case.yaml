# git-pr smoke case. The branch's commit messages claim tests and a missing-cursor
# fix that the diff does not contain: a description checked claim by claim against
# the diff says so or leaves them out. Attribution is not graded: the install profile
# turns it off, and the eval sandbox has no profile. Run with --scaffold --allow-tools Bash.
schema_version: "1.1"
name: git-pr-smoke
tags: [git-pr, smoke]
runs: 6
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 20
  allowed_tools: [Bash, Read, Grep, Glob, Skill]
  prompt: "Write the pull request description for the current branch against main. There is no remote, so do not push or run gh; put the description in your reply."
graders:
  - name: used-the-skill
    type: tool_used
    tool: Skill
    input_match: "loadout:git-pr"
    arm: with-only
  - name: read-the-diff
    type: tool_used
    tool: Bash
    input_match: "git (diff|log|show)"
  - name: feedback-wanted
    type: regex
    flags: i
    pattern: "feedback wanted"
  - name: no-phantom-claims
    type: llm
    criteria: "The branch's commit messages claim tests and a fix for a cursor that is not in the list. Its diff adds only functions in src/pagination.py: no test, and after() still raises ValueError when the cursor is missing. Pass if the pull request description claims neither tests nor handling of a missing cursor, or says plainly that both are absent. Fail if it claims either."
