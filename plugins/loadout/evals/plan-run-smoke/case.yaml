# Smoke case for plan-run: a written plan in a git repository is carried out one
# task at a time, each in a fresh subagent that writes the task's test, makes it
# pass and commits. Run with --scaffold --allow-tools Write Edit Bash Agent.
schema_version: "1.1"
name: plan-run-smoke
tags: [smoke, plan-run]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Glob, Grep, Write, Edit, Bash, Agent]
  prompt: "Execute the plan in docs/plans/two-helpers.md."
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: plan-run
    arm: with-only
  - name: subagent-per-task
    type: tool_used
    tool: Agent
    min: 2
  - name: tasks-on-sonnet
    type: tool_used
    tool: Agent
    input_match: "model.{0,4}sonnet"
    min: 2
  - name: slugify-written
    type: file_exists
    path: src/text_utils.py
  - name: clamp-written
    type: file_exists
    path: src/math_utils.py
  - name: tests-written
    type: file_exists
    path: tests/test_math_utils.py
  - name: one-commit-per-task
    type: tool_used
    tool: Bash
    input_match: "git commit"
    min: 2
