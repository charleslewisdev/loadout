# map-scout stays quiet when no repo relates to the idea: the same canned gh answer, with
# an idea none of its repos touch. Run with --scaffold --allow-tools Bash.
schema_version: "1.1"
name: map-scout-portfolio-quiet
tags: [map-scout, portfolio]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Skill, Bash, Read, Glob, Grep]
  prompt: "/loadout:map-scout I want to add a dark theme to our note-taking web app. Nothing is decided yet. Help me work out the design. There is no repository in this session; answer in your reply."
graders:
  - name: ran-the-lookup
    type: tool_used
    tool: Bash
    input_match: map-scout/portfolio
  - name: stayed-quiet
    type: llm
    criteria: "Pass only if the reply names none of hookrelay, trailcam-sorter or pantry-tracker, and says nothing about having checked other repositories or a portfolio."
  - name: one-question
    type: llm
    criteria: "Pass only if the reply asks the user exactly one question and stops there, without presenting a finished design. A short restatement of the goal, a note on a related repo, or a note on what comes next is fine; offering labeled options for that one question is fine. Asking that same question again in other words at the end, or adding \"or something else?\", still counts as one question. Fail if the reply asks two or more questions, or lays out a full design or plan before asking anything."
