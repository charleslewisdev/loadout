# code-review smoke case, typed: /loadout:code-review on a feature branch with a
# counting bug its own test misses and a broken project rule. The skill's point is
# the team: checks first, independent reviewer subagents, a verifier. The skill is
# typed only, because a bundled skill is also named code-review and the model picks
# that one. Run with --scaffold --allow-tools Bash Agent.
schema_version: "1.1"
name: code-review-smoke
tags: [smoke, code-review]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Bash, Glob, Grep, Agent, Skill]
  prompt: "/loadout:code-review my branch feature/page-count against main, before I open a PR."
graders:
  - name: ran-the-tests
    type: tool_used
    tool: Bash
    input_match: "unittest|pytest"
  - name: independent-reviewers
    type: tool_used
    tool: Agent
    min: 3
  - name: found-the-bug
    type: llm
    criteria: "Pass only if the review reports that page_count undercounts when total is not a multiple of per_page (for example 10 items at 3 per page gives 3 instead of 4 pages)."
  - name: found-the-rule-break
    type: llm
    criteria: "The project's CLAUDE.md says public functions validate their arguments and raise ValueError on bad input, and page_count on the branch does not validate its arguments. Pass only if the review reports that page_count skips this validation and ties it to the project's rule."
