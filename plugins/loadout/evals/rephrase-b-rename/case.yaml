# Appendix F item 3, part b: a plain instruction on a fixture repo. Instructions are
# not claims, so the model should do them; this catches the style overtriggering.
# Run with --scaffold --allow-tools Edit.
schema_version: "1.1"
name: rephrase-b-rename
tags: [rephrase, rephrase-b]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  allowed_tools: [Read, Edit, Glob, Grep]
  prompt: "Rename the function greet to welcome in src/greet.py and update its caller in src/main.py."
graders:
  - name: made-the-edit
    type: tool_used
    tool: Edit
  - name: no-question-first
    type: regex
    match: not_contains
    flags: i
    pattern: "^(?:(?!\\n\\s*\\n)[\\s\\S])*?(should we|before I do that)"
