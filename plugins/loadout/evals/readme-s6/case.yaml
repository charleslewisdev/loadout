# The README test: a fresh session with only README.md answers four questions.
# It tests the README, not the plugin, so the delta is about zero by design; it
# passes when every answer is complete. The without arm is the stricter reading of
# "only the README in context". Facts are graded by regex, judgment by llm. The
# README is a filter, so the layer table and the glossary answer live in the
# guide, and this case asks where the depth is instead.
# Run with --scaffold.
schema_version: "1.1"
name: readme-s6
tags: [docs, s6]
runs: 5
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 4
  allowed_tools: [Read]
  prompt: >-
    Read README.md in this directory and use nothing else: no other file and no
    prior knowledge of this project. Answer four questions under numbered
    headings. 1. Why does a harness exist? 2. How do I install it? 3. How do I
    add a skill? 4. Where do I read more about how and why it works?
graders:
  - name: why-a-harness
    type: llm
    criteria: "Judge only the answer to question 1. Pass if it says both (a) that every session starts without knowing the user's preferences, repo conventions or past lessons, and a harness deliberately decides where that knowledge lives (versioned or shared across machines), and (b) that the failure to guard against is growth or accretion, so the harness stays small and measured. Fail if either point is missing."
  - name: install
    type: regex
    pattern: 'install\.sh'
  # The four facts question 3 needs, checked by regex: an llm judge failed complete
  # answers here in 9 of 18 runs.
  - name: add-a-skill-skill-md
    type: regex
    pattern: 'skills/[^\s`]+/SKILL\.md'
  - name: add-a-skill-description-limit
    type: regex
    pattern: '200 char'
  - name: add-a-skill-eval
    type: regex
    pattern: 'scripts/eval'
  - name: add-a-skill-check-or-pr
    type: regex
    flags: i
    pattern: 'scripts/check|pull request|\bPR\b'
  - name: read-more
    type: regex
    pattern: 'WRITING-AN-EFFECTIVE-HARNESS|Writing an effective harness'
