# code-debug smoke case: a reported bug in a small package whose tests miss it.
# The skill's point is the order: a failing test that reproduces the bug comes
# before any change to the source. Run with --scaffold --allow-tools Bash Edit Write.
# On this machine the eval sandbox cannot run Bash (bubblewrap is blocked by
# kernel.apparmor_restrict_unprivileged_userns), so graders judge attempts, order
# and final files, never a command's output.
schema_version: "1.1"
name: code-debug-smoke
tags: [smoke, code-debug]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Edit, Write, Bash, Glob, Grep, Skill]
  prompt: "parse_duration(\"1h30m\") returns 1800 instead of 5400. Please fix it."
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "loadout:code-debug"
    arm: with-only
  - name: test-edited-before-fix
    type: tool_order
    before:
      tool: Edit
      input_match: "\"file_path\":\\s*\"[^\"]*tests/"
    after:
      tool: Edit
      input_match: "\"file_path\":\\s*\"[^\"]*durations/parse\\.py\""
  - name: test-run-before-fix
    type: tool_order
    before:
      tool: Bash
      input_match: "unittest|pytest"
    after:
      tool: Edit
      input_match: "\"file_path\":\\s*\"[^\"]*durations/parse\\.py\""
  - name: fixed
    type: llm
    focus:
      source: file
      path: durations/parse.py
    criteria: "Pass only if parse_duration adds up every matched unit, so that \"1h30m\" gives 5400."
